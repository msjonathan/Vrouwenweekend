<section style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 24px">

  <p style="margin: 0 0 24px">Geen reservatie nodig voor de stad zelf. Winkels, koffie, cultuur en een bootje als de benen meewerken.</p>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px">

      <span>Toegang via de tunnel onder Koning Albert I-laan. Lift en voorbehouden plaatsen. Ca. 10 min naar de Markt.</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1">€16,80<span style="font-size: 16px; font-weight: 600"> max / 24 u · 1e uur gratis</span></span>
    </div>
    <div style="background: #FFFFFF; border-radius: 24px; padding: 26px; display: flex; flex-direction: column; gap: 10px; border: 2px solid #15171C">

      <strong style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.05">Centrum-Station</strong>
      <span>Chantrellstraat 42. Lift en voorbehouden plaatsen. Ca. 20 min stappen, of gratis bus naar het centrum voor max. 4 personen per parkeerticket.</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1">€7<span style="font-size: 16px; font-weight: 600"> max / 24 u</span></span>
    </div>
  </div>
  <p style="margin: 16px 0 0; font-size: 18px; max-width: 820px"><strong>Onze tip:</strong> neem ’t Zand als de rolstoel meegaat of als jullie minder willen stappen. Dit weekend is comfort geen decadentie; het is logistiek.</p>

    <a href="https://www.visitbruges.be/nl/plan-je-bezoek/parkeren" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #15171C; color: #15171C; text-decoration: none; font-weight: 600; font-size: 14px">Alle parkings ↗</a>

<section style="max-width: 1200px; margin: 0 auto; padding: 32px 24px">

    <p style="flex: 1 1 420px; margin: 0">Kort genoeg om vaak te stoppen, centraal genoeg voor koffie, lunch en winkels. <strong>Toilettip:</strong> toegankelijk toilet bij de ondergrondse parking ’t Zand en op/naast de Markt bij Historium/Stadshallen.</p>

<section style="max-width: 1200px; margin: 0 auto; padding: 32px 24px">

            <p style="margin: 0; font-weight: 600; font-size: 15px">{{c.meta}}</p>
            <span style="align-self: flex-start; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{c.bg}}; color: {{c.fg}}">{{c.glyph}} {{c.level}}</span>
            <p style="margin: 0; font-size: 15px; color: #4A4E57">{{c.terrain}}</p>
            <p style="margin: 0; font-size: 16px">{{c.body}}</p>
            <sc-for list="{{c.tips}}" as="t" hint-placeholder-count="0">
              <p style="margin: 0; font-size: 15px; padding-top: 8px; border-top: 1px solid #D5D7D0"><strong>{{t.k}}</strong> {{t.v}}</p>

            <div style="margin-top: auto; padding-top: 4px; display: flex; flex-wrap: wrap; gap: 8px">

        </sc-for>
      </div>
      <sc-if value="{{g.hasNote}}" hint-placeholder-val="{{ false }}">

          <strong style="flex: 0 0 auto; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px">{{g.noteTitle}}</strong>
          <span style="flex: 1 1 480px">{{g.noteText}}</span>
        </div>
      </sc-if>
    </section>
  </sc-if>
</sc-for>
