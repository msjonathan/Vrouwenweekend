<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Zet JavaScript aan om deze gids te bekijken.</p></noscript>
<script src="assets/vw.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { slot: "kort", done: {} };
  }
  renderVals() {
    const defs = [
      { id: "kort", label: "45 min", short: "nog over na het inpakken", title: "45 minuten:", text: "koffiekoeken ophalen, rustig ontbijten, groepsfoto en vertrekken." },
      { id: "twee", label: "2 uur", short: "nog over na het inpakken", title: "2 uur:", text: "na check-out koffie bij Morris of een kort stuk van de Camino-route." },
      { id: "half", label: "Halve dag", short: "niemand heeft haast", title: "Een halve dag:", text: "lunch in Brugge of Oostende, Historium, Kinepolis of zeedijk + vis." }
    ];
    const cur = defs.find((d) => d.id === this.state.slot) || defs[0];
    const slots = defs.map((d) => ({
      label: d.label, short: d.short, text: d.text.charAt(0).toUpperCase() + d.text.slice(1),
      pressed: d.id === cur.id ? "true" : "false",
      bg: d.id === cur.id ? "#15171C" : "#FFFFFF",
      fg: d.id === cur.id ? "#F1F2EE" : "#15171C",
      pick: () => this.setState({ slot: d.id })
    }));
    const items = [
      "Weer en wind: KMI/weer-app.",
      "NMBS-werken en vervangbussen: NMBS-app.",
      "Openingsuren en of er nog tickets zijn: officiële website van de gekozen activiteit.",
      "Restaurant: reservatie voor 14 bevestigd.",
      "Indien nodig: rolstoel, parkeerkaart en European Disability Card mee. Voorgeschreven medicatie niet vergeten."
    ];
    const done = this.state.done;
    const checks = items.map((text, i) => {
      const on = !!done[i];
      return {
        text,
        pressed: on ? "true" : "false",
        bg: on ? "#DDEFE4" : "#FFFFFF",
        boxBg: on ? "#14543A" : "#FFFFFF",
        mark: on ? "✓" : "",
        strike: on ? "line-through" : "none",
        toggle: () => this.setState({ done: Object.assign({}, done, { [i]: !on }) })
      };
    });
    const doneCount = items.filter((_, i) => done[i]).length;
    const doneText = doneCount === items.length ? "Klaar. Rijden maar." : doneCount === 0 ? "Nog niets afgevinkt." : "Goed bezig.";
    return { slots, slotTitle: cur.title, slotText: cur.text, checks, doneCount, totalCount: items.length, doneText };
  }
}
mountPage(Component);
</script>
