<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F1F2EE">
<title>Vrouwenweekend 2026 — start</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F1F2EE}
a{color:#2340E0}a:hover{color:#15171C}
@media (max-width:700px){.vw-sticker{position:static !important;margin-top:24px;width:136px !important;height:136px !important;transform:rotate(-5deg) !important}}
</style>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<template id="page-template">
<div style="font-family: 'Instrument Sans', 'Helvetica Neue', sans-serif; color: #15171C; background: #F1F2EE; font-size: 17px; line-height: 1.55">

<header style="max-width: 1200px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; border-bottom: 2px solid #15171C">
  <a href="index.html" style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em; color: #15171C; text-decoration: none">VW<span style="color: #2340E0">26</span></a>
  <nav aria-label="Hoofdstukken" style="display: flex; flex-wrap: wrap; gap: 4px 6px">
    <a href="#villa" style="padding: 10px 14px; border-radius: 999px; color: #15171C; text-decoration: none; font-weight: 600; font-size: 15px">Villa &amp; eten</a>
    <a href="#dichtbij" style="padding: 10px 14px; border-radius: 999px; color: #15171C; text-decoration: none; font-weight: 600; font-size: 15px">Dichtbij</a>
    <a href="brugge.html" style="padding: 10px 14px; border-radius: 999px; color: #15171C; text-decoration: none; font-weight: 600; font-size: 15px">Brugge</a>
    <a href="oostende.html" style="padding: 10px 14px; border-radius: 999px; color: #15171C; text-decoration: none; font-weight: 600; font-size: 15px">Oostende</a>
    <a href="zondag.html" style="padding: 10px 16px; border-radius: 999px; background: #15171C; color: #F1F2EE; text-decoration: none; font-weight: 600; font-size: 15px">Spiekbrief</a>
  </nav>
</header>

<section style="max-width: 1200px; margin: 0 auto; padding: 48px 24px 0; position: relative">
  <p style="margin: 0 0 8px; font-weight: 600; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase">De survivalgids</p>
  <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(48px, 14vw, 196px); line-height: 0.86; letter-spacing: -0.05em">Vrouwen&#173;<br><span style="white-space: nowrap">weekend<span style="color: #2340E0">’26</span></span></h1>
  <div class="vw-sticker" style="position: absolute; right: 24px; top: 40px; width: 168px; height: 168px; border-radius: 50%; background: #E8472B; color: #15171C; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: rotate(9deg); font-family: 'Bricolage Grotesque', sans-serif">
    <span style="font-size: 64px; font-weight: 800; line-height: 0.95">43</span>
    <span style="font-size: 15px; font-weight: 600; line-height: 1.15">uur zonder<br>klok</span>
  </div>
  <div style="margin-top: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); border-top: 2px solid #15171C; border-bottom: 2px solid #15171C">
    <div style="padding: 16px 16px 16px 0"><span style="display: block; font-size: 13px; color: #4A4E57; text-transform: uppercase; letter-spacing: 0.1em">Wanneer</span><strong style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px">16–18 oktober</strong></div>
    <div style="padding: 16px 16px 16px 0"><span style="display: block; font-size: 13px; color: #4A4E57; text-transform: uppercase; letter-spacing: 0.1em">Waar</span><strong style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px">Villa Sint-Hubertus</strong></div>
    <div style="padding: 16px 16px 16px 0"><span style="display: block; font-size: 13px; color: #4A4E57; text-transform: uppercase; letter-spacing: 0.1em">Wie</span><strong style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px">14 vrouwen</strong></div>
  </div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 56px 24px; display: flex; flex-wrap: wrap; gap: 32px 64px">
  <h2 style="flex: 1 1 320px; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(40px, 5vw, 64px); line-height: 0.98; letter-spacing: -0.03em">Jullie zitten aan het <span style="background: #2340E0; color: #FFFFFF; padding: 0 10px; border-radius: 10px">stuur.</span></h2>
  <div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 14px; font-size: 19px">
    <p style="margin: 0">Dit weekend is van jullie. Niet van de klok, niet van een Excelbestand en al helemaal niet van iemand die om 08:00 roept dat we nú moeten vertrekken.</p>
    <p style="margin: 0">Wij hebben ideeën, routes en praktische trucs verzameld. Jullie kiezen ter plaatse wat jullie zien zitten: Brugge of zee, kunst of koffie, een wandeling of nog een rondje aan tafel. Splitsen mag. Van gedacht veranderen ook.</p>
    <p style="margin: 0; font-style: italic; color: #4A4E57">De dag voor vertrek laten we weten hoeveel budget er op de vrouwenrekening staat.</p>
  </div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 0 24px 56px">
  <div style="background: #15171C; color: #F1F2EE; border-radius: 28px; padding: 36px; display: flex; flex-wrap: wrap; gap: 28px 56px">
    <div style="flex: 1 1 380px">
      <h2 style="margin: 0 0 12px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; letter-spacing: -0.02em">Hoe gebruik je deze gids?</h2>
      <p style="margin: 0 0 10px">Kies wat jullie zaterdag doen, open die pagina en hou de spiekbrief bij de hand. Met 14 is het altijd slim om even te bellen of een tijdslot te checken.</p>
      <p style="margin: 0; color: #C9CCD3">De rolstoel is vooral handig voor langere afstanden; korte stukken stappen lukken ook.</p>
    </div>
    <ul style="flex: 1 1 300px; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <li style="display: flex; gap: 12px; align-items: center"><span style="flex: 0 1 auto; padding: 6px 12px; border-radius: 999px; background: #DDEFE4; color: #14543A; font-weight: 600; font-size: 14px">● Goed haalbaar</span><span style="color: #C9CCD3; font-size: 15px">vlak, toegankelijk</span></li>
      <li style="display: flex; gap: 12px; align-items: center"><span style="flex: 0 1 auto; padding: 6px 12px; border-radius: 999px; background: #FBEBC8; color: #7A4700; font-weight: 600; font-size: 14px">◐ Met wat hulp</span><span style="color: #C9CCD3; font-size: 15px">kasseien, drempels, even navragen</span></li>
      <li style="display: flex; gap: 12px; align-items: center"><span style="flex: 0 1 auto; padding: 6px 12px; border-radius: 999px; background: #FBDAD3; color: #9C2512; font-weight: 600; font-size: 14px">▲ Pittiger</span><span style="color: #C9CCD3; font-size: 15px">trappen; rolstoel kan niet mee</span></li>
    </ul>
  </div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 0 24px 24px">
  <h2 style="margin: 0 0 18px; font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Ga meteen naar</h2>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr)); gap: 12px">
    <a href="#villa" style="display: flex; flex-direction: column; gap: 28px; padding: 20px; border: 2px solid #15171C; border-radius: 20px; text-decoration: none; color: #15171C; background: #FFFFFF; min-height: 150px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1">01</span><span><strong style="display: block; font-size: 20px">Villa &amp; eten</strong><span style="font-size: 15px; color: #4A4E57">aankomst, boodschappen, bakker</span></span></a>
    <a href="#zaterdag" style="display: flex; flex-direction: column; gap: 28px; padding: 20px; border: 2px solid #15171C; border-radius: 20px; text-decoration: none; color: #15171C; background: #FFFFFF; min-height: 150px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1">02</span><span><strong style="display: block; font-size: 20px">Kies je zaterdag</strong><span style="font-size: 15px; color: #4A4E57">Brugge, Oostende of dichtbij</span></span></a>
    <a href="brugge.html" style="display: flex; flex-direction: column; gap: 28px; padding: 20px; border: 2px solid #C7361C; border-radius: 20px; text-decoration: none; color: #FFFFFF; background: #C7361C; min-height: 150px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1">03</span><span><strong style="display: block; font-size: 20px">Brugge</strong><span style="font-size: 15px">parkeren, wandelen, kunst, cocktails</span></span></a>
    <a href="oostende.html" style="display: flex; flex-direction: column; gap: 28px; padding: 20px; border: 2px solid #2340E0; border-radius: 20px; text-decoration: none; color: #FFFFFF; background: #2340E0; min-height: 150px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1">04</span><span><strong style="display: block; font-size: 20px">Oostende</strong><span style="font-size: 15px">zee, stockverkoop, cocktails</span></span></a>
    <a href="zondag.html" style="display: flex; flex-direction: column; gap: 28px; padding: 20px; border: 2px solid #15171C; border-radius: 20px; text-decoration: none; color: #F1F2EE; background: #15171C; min-height: 150px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1">05</span><span><strong style="display: block; font-size: 20px">Zondag &amp; spiekbrief</strong><span style="font-size: 15px; color: #C9CCD3">uitchecken, alles op één pagina</span></span></a>
  </div>
  <p style="margin: 18px 0 0; font-size: 15px; color: #4A4E57; max-width: 760px">Spoorwerken op zaterdag en zondag maken de trein vanuit Oostkamp minder voorspelbaar. Daarom vertrekt elke stadsroute in deze gids met de auto; het openbaar vervoer staat erbij als alternatief.</p>
</section>

<section id="villa" style="max-width: 1200px; margin: 0 auto; padding: 72px 24px 24px">
  <p style="margin: 0; font-weight: 600; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #2340E0">De uitvalsbasis</p>
  <h2 style="margin: 6px 0 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(44px, 6vw, 84px); line-height: 0.95; letter-spacing: -0.04em">Villa Sint-Hubertus</h2>
  <p style="margin: 0 0 32px; font-size: 20px">Kortrijksestraat 454, 8020 Oostkamp</p>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px">
    <div style="background: #FFFFFF; border-radius: 20px; padding: 24px"><span style="display: block; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 72px; line-height: 1; letter-spacing: -0.04em">16:00</span><span style="font-size: 16px">vrijdag: inchecken</span></div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 24px"><span style="display: block; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 72px; line-height: 1; letter-spacing: -0.04em">11:00</span><span style="font-size: 16px">zondag: uitchecken</span></div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 24px"><span style="display: block; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 72px; line-height: 1; letter-spacing: -0.04em">±4</span><span style="font-size: 16px">auto’s op de oprit; extra gratis langs de straat</span></div>
  </div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px">
  <div style="flex: 2 1 520px">
    <h3 style="margin: 0 0 16px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; letter-spacing: -0.02em">Aankomen zonder parkeer-Tetris</h3>
    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <li style="display: flex; gap: 16px; align-items: baseline; border-top: 1.5px solid #15171C; padding-top: 12px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; color: #2340E0">1</span><span>Zet eerst ongeveer vier wagens op de oprit voor de garage.</span></li>
      <li style="display: flex; gap: 16px; align-items: baseline; border-top: 1.5px solid #15171C; padding-top: 12px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; color: #2340E0">2</span><span>Parkeer de andere wagens netjes langs de straat, zonder opritten of doorgangen te blokkeren.</span></li>
      <li style="display: flex; gap: 16px; align-items: baseline; border-top: 1.5px solid #15171C; padding-top: 12px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; color: #2340E0">3</span><span>Laad eerst de koffers en Collect&amp;Go-bakken uit, en schuif pas daarna met de auto’s.</span></li>
    </ol>
  </div>
  <div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 12px">
    <div style="background: #DDE3FB; border-radius: 20px; padding: 22px">
      <strong style="display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; margin-bottom: 6px">Sleutel &amp; wifi</strong>
      <span>De code van het sleutelkluisje en de wifi-gegevens krijgen jullie pas 48 uur op voorhand in de groepschat, niet in deze gids.</span>
    </div>
    <a href="tel:112" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #C7361C; color: #FFFFFF; border-radius: 20px; padding: 18px 22px; text-decoration: none; min-height: 44px"><span><strong style="display: block; font-size: 18px">In nood: bel 112</strong><span style="font-size: 14px">het adres staat hierboven</span></span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px">112</span></a>
  </div>
</section>

<section id="eten" style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 24px">
  <h2 style="margin: 0 0 8px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 4.5vw, 56px); letter-spacing: -0.03em; line-height: 1">Eten zonder weekend&#173;keukenstress</h2>
  <p style="margin: 0 0 24px; max-width: 760px">De Collect&amp;Go-bestelling halen we op voorhand op en verdelen we bij vertrek over de auto’s. De aperohapjes voor vrijdag zitten erbij.</p>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 12px">
    <div style="border: 2px solid #15171C; border-radius: 20px; padding: 22px"><strong style="display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; margin-bottom: 8px">Vrijdagavond</strong>Aperohapjes zijn geregeld. Voor het avondeten: samen koken of een restaurantje boeken. Spreek dat op voorhand af, zodat de ingrediënten in huis zijn of er een tafel voor 14 gereserveerd is.</div>
    <div style="border: 2px solid #15171C; border-radius: 20px; padding: 22px"><strong style="display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; margin-bottom: 8px">Zaterdag</strong>Uitgebreid ontbijt, lunch afhankelijk van de uitstap, ’s avonds thuis eten of op restaurant.</div>
    <div style="border: 2px solid #15171C; border-radius: 20px; padding: 22px"><strong style="display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; margin-bottom: 8px">Zondagochtend</strong>Koffiekoeken, brood, fruit en een restjesbuffet. De koelkast leegeten is geen gierigheid, het is duurzaam vrouwenweekendmanagement.</div>
    <div style="border: 2px solid #15171C; border-radius: 20px; padding: 22px"><strong style="display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; margin-bottom: 8px">Drank</strong>Water, koffie en thee, cava, wijn en bier, én genoeg alcoholvrije drankjes.</div>
  </div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 48px 24px 24px">
  <h2 style="margin: 0 0 24px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(32px, 4vw, 48px); letter-spacing: -0.03em; line-height: 1">Koffie, brood en vergeten cava</h2>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(270px, 100%), 1fr)); gap: 12px">
    <sc-for list="{{shops}}" as="c" hint-placeholder-count="4">
      <article style="background: #FFFFFF; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #4A4E57">{{c.kicker}}</span>
        <h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; line-height: 1.1; letter-spacing: -0.01em">{{c.title}}</h3>
        <p style="margin: 0; font-weight: 600; font-size: 15px">{{c.meta}}</p>
        <p style="margin: 0; font-size: 16px">{{c.body}}</p>
        <div style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{c.links}}" as="l" hint-placeholder-count="1">
            <a href="{{l.u}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #15171C; color: #15171C; text-decoration: none; font-weight: 600; font-size: 14px">{{l.t}} ↗</a>
          </sc-for>
        </div>
      </article>
    </sc-for>
  </div>
</section>

<section id="dichtbij" style="max-width: 1200px; margin: 0 auto; padding: 72px 24px 24px">
  <p style="margin: 0; font-weight: 600; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #2340E0">Zonder ver te rijden</p>
  <h2 style="margin: 6px 0 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(40px, 5vw, 68px); line-height: 0.98; letter-spacing: -0.04em">Dicht bij de villa</h2>
  <p style="margin: 0 0 24px; max-width: 760px">Geen verplicht programma, wel opties die net op 16–18 oktober plaatsvinden. Check vrijdag nog eens of er nog tickets zijn en of er niets veranderd is.</p>
  <div role="group" aria-label="Filter op terrein" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #15171C; font: 600 15px 'Instrument Sans', sans-serif; cursor: pointer; background: {{f.bg}}; color: {{f.fg}}">{{f.label}} · {{f.count}}</button>
    </sc-for>
  </div>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 12px">
    <sc-for list="{{nearby}}" as="c" hint-placeholder-count="5">
      <article style="background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #2340E0">{{c.kicker}}</span>
        <h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; line-height: 1.1; letter-spacing: -0.01em">{{c.title}}</h3>
        <p style="margin: 0; font-weight: 600; font-size: 15px">{{c.meta}}</p>
        <span style="align-self: flex-start; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{c.bg}}; color: {{c.fg}}">{{c.glyph}} {{c.level}}</span>
        <p style="margin: 0; font-size: 15px; color: #4A4E57">{{c.terrain}}</p>
        <p style="margin: 0; font-size: 16px">{{c.body}}</p>
        <div style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{c.links}}" as="l" hint-placeholder-count="1">
            <a href="{{l.u}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #15171C; color: #15171C; text-decoration: none; font-weight: 600; font-size: 14px">{{l.t}} ↗</a>
          </sc-for>
        </div>
      </article>
    </sc-for>
  </div>
  <sc-if value="{{nearbyEmpty}}" hint-placeholder-val="{{ false }}">
    <p style="margin: 0; padding: 24px; border: 2px dashed #15171C; border-radius: 20px">Niets met dit label dichtbij — kies een ander filter.</p>
  </sc-if>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 24px">
  <div style="display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: flex-end; margin-bottom: 24px">
    <h2 style="flex: 1 1 360px; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(32px, 4vw, 48px); letter-spacing: -0.03em; line-height: 1">Aan tafel rond de villa</h2>
    <p style="flex: 1 1 360px; margin: 0; font-size: 16px"><strong>Met 14 aan tafel:</strong> reserveer voor vrijdagavond op voorhand; voor zaterdag kan dat vrijdag nog. Vermeld het aantal personen, eventuele allergieën en dat jullie een goed bereikbare tafel en toilet nodig hebben.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(270px, 100%), 1fr)); gap: 12px">
    <sc-for list="{{restaurants}}" as="c" hint-placeholder-count="4">
      <article style="border: 2px solid #15171C; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #4A4E57">{{c.kicker}}</span>
