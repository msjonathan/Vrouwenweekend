      <p style="margin: 0">Dit weekend maken spoorwerken en vervangbussen die keuze minder comfortabel. De auto blijft de groepskeuze.</p>
    </div>

      <li><strong>In Oostende:</strong> centrum, Visserskaai en zeedijk combineer je goed te voet. Kusttram en bussen gebruiken De Lijn-tickets; check in de app welke halte toegankelijk is.</li>
    </ul>
  </div>
</section>
